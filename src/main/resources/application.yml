spring:
  application:
    name: docintel

server:
  port: 8080

docintel:
  retrieval:
    # How many passages to retrieve per question.
    top-k: 3
    # Minimum cosine similarity the best passage must reach. Below it the service
    # refuses to answer and escalates, rather than answering without grounding.
    similarity-floor: 0.05

  llm:
    # Order in which live providers are tried. A provider is only activated when its
    # API key is set; the deterministic offline fallback is always appended last.
    # With no keys set (the default), the service answers extractively with no network.
    providers:
      - anthropic
      - openai
    timeout-ms: 20000
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: claude-3-5-haiku-latest
      base-url: https://api.anthropic.com
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4o-mini
      base-url: https://api.openai.com

logging:
  level:
    com.angelo.docintel: INFO
